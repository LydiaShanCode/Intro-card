<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Hey, Lydia here.</title>
<meta name="description" content="A small note from Lydia Shan — product designer." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Hey, Lydia here." />
<meta property="og:description" content="If you’re reading this message it means I think highly of you, and would like to get to know you." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Hey, Lydia here." />
<meta name="twitter:description" content="If you’re reading this message it means I think highly of you, and would like to get to know you." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap" rel="stylesheet" />

<script>document.documentElement.className += " js";</script>

<style>
  :root {
    --bg: #ffffff;
    --ink: #1c1c1c;
    --subdued: #6f6f6f;
    --light: #a0a0a0;
    --primary: #001dd9;
    --ease-smooth: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.5rem, 7vw, 4rem);
    padding-top: max(clamp(1.5rem, 7vw, 4rem), env(safe-area-inset-top));
    padding-bottom: max(clamp(1.5rem, 7vw, 4rem), env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    font-family: Geist, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .card {
    width: 100%;
    /* The message's type size is set here so the `ch` cap below resolves
       against it, holding the line breaks close to the original design. */
    font-size: clamp(1.375rem, 5.6vw, 1.75rem);
    max-width: 22ch;
  }

  .js .card { animation: fade-in 0.8s var(--ease-smooth) both; }

  .message {
    position: relative;
    margin: 0;
    font-size: 1em;
    line-height: 1.4;
    letter-spacing: -0.017em;
  }

  /* The ghost copy holds the block at its final height so nothing shifts
     while typing. It becomes the visible text when JS is unavailable. */
  .js .ghost { visibility: hidden; }

  .live { display: none; }

  .js .live {
    display: block;
    position: absolute;
    inset: 0;
  }

  .caret {
    display: inline-block;
    width: 2px;
    height: 1.05em;
    vertical-align: -0.14em;
    margin-left: 0.07em;
    background: var(--primary);
    animation: blink 1.1s steps(1, end) infinite;
  }

  /* Hold the caret solid while characters land, blink only once idle. */
  .is-typing .caret { animation: none; }

  .socials {
    margin-top: clamp(2.5rem, 11vh, 5rem);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.1em;
    font-size: clamp(1rem, 3.9vw, 1.125rem);
    letter-spacing: -0.008em;
  }

  .js .socials {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 0.7s var(--ease-smooth), transform 0.7s var(--ease-smooth);
  }

  .js .socials.is-revealed {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }

  .socials a {
    color: var(--subdued);
    text-decoration: none;
    padding: 0.15em 0;
    border-radius: 4px;
    transition: color 0.25s var(--ease-smooth);
  }

  .socials a:hover,
  .socials a:focus-visible { color: var(--primary); }

  .socials a:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 3px;
  }

  .socials .sep {
    color: var(--light);
    -webkit-user-select: none;
    user-select: none;
  }

  .signature {
    margin: 1.75rem 0 0;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 0.6875rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .js .signature {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s var(--ease-smooth) 0.25s;
  }

  .js .signature.is-revealed {
    opacity: 1;
    pointer-events: auto;
  }

  .signature a {
    color: var(--light);
    text-decoration: none;
    transition: color 0.25s var(--ease-smooth);
  }

  .signature a:hover,
  .signature a:focus-visible { color: var(--primary); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .js .card { animation: none; }
    .caret { animation: none; }
    .js .socials, .js .signature { transition: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="message" aria-hidden="true"><span class="ghost" id="ghost">Hey, Lydia here. If you’re reading this message it means I think highly of you, and would like to get to know you.</span><span class="live"><span id="typed"></span><span class="caret"></span></span></p>

    <p class="sr-only">Hey, Lydia here. If you’re reading this message it means I think highly of you, and would like to get to know you.</p>

    <nav class="socials" id="socials" aria-label="Social links">
      <a href="https://www.instagram.com/lydia_shann/" target="_blank" rel="noopener">Instagram</a>
      <span class="sep" aria-hidden="true">/</span>
      <a href="https://x.com/lydia_shann" target="_blank" rel="noopener">Twitter</a>
      <span class="sep" aria-hidden="true">/</span>
      <a href="https://www.are.na/lydia-shan" target="_blank" rel="noopener">Arena</a>
    </nav>

    <p class="signature" id="signature">
      <a href="https://lydiashan.com" target="_blank" rel="noopener">lydiashan.com</a>
    </p>
  </main>

<script>
(function () {
  var CHAR_MS = 34;      // base gap between characters
  var JITTER_MS = 26;    // random extra, keeps the rhythm from feeling mechanical
  var COMMA_MS = 190;    // breath after , ; :
  var PERIOD_MS = 460;   // longer breath after . ! ?
  var START_MS = 600;    // beat before the first character
  var REVEAL_MS = 420;   // beat before the links arrive

  var text = document.getElementById("ghost").textContent;
  var typed = document.getElementById("typed");
  var message = typed.parentNode.parentNode;
  var socials = document.getElementById("socials");
  var signature = document.getElementById("signature");

  var timer = null;
  var index = 0;
  var settled = false;

  function reveal() {
    socials.classList.add("is-revealed");
    signature.classList.add("is-revealed");
  }

  function stopListening() {
    window.removeEventListener("pointerdown", skip);
    window.removeEventListener("keydown", onKey);
  }

  function settle() {
    settled = true;
    clearTimeout(timer);
    stopListening();
    message.classList.remove("is-typing");
    reveal();
  }

  function skip() {
    if (settled) return;
    typed.textContent = text;
    settle();
  }

  function onKey(event) {
    if (event.key === "Escape" || event.key === "Enter" || event.key === " " || event.key === "Tab") skip();
  }

  function delayAfter(char) {
    if (char === "." || char === "!" || char === "?") return PERIOD_MS;
    if (char === "," || char === ";" || char === ":") return COMMA_MS;
    return CHAR_MS + Math.random() * JITTER_MS;
  }

  function step() {
    if (settled) return;

    if (index >= text.length) {
      message.classList.remove("is-typing");
      timer = setTimeout(settle, REVEAL_MS);
      return;
    }

    var char = text.charAt(index);
    typed.textContent += char;
    index += 1;
    timer = setTimeout(step, delayAfter(char));
  }

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    typed.textContent = text;
    reveal();
    return;
  }

  // Let people jump straight to the message if they'd rather just read it.
  window.addEventListener("pointerdown", skip);
  window.addEventListener("keydown", onKey);

  message.classList.add("is-typing");
  timer = setTimeout(step, START_MS);
})();
</script>
</body>
</html>
