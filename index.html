<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Hey, Lydia here.</title>
<meta name="description" content="A small note from Lydia Shan — product designer." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/svg+xml" href="logo.svg" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Hey, Lydia here." />
<meta property="og:description" content="If you’re reading this message it means I think highly of you, and would like to get to know you." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Hey, Lydia here." />
<meta name="twitter:description" content="If you’re reading this message it means I think highly of you, and would like to get to know you." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap" rel="stylesheet" />

<script>document.documentElement.className += " js";</script>

<style>
  :root {
    --bg: #ffffff;
    --ink: #1c1c1c;
    --subdued: #6f6f6f;
    --light: #a0a0a0;
    --faint: #d8d8d8;
    --primary: #001dd9;
    --ease-smooth: cubic-bezier(0.22, 0.61, 0.36, 1);
    --ease-dramatic: cubic-bezier(0.12, 0.8, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.5rem, 7vw, 4rem);
    padding-top: max(clamp(1.5rem, 7vw, 4rem), env(safe-area-inset-top));
    padding-bottom: max(clamp(1.5rem, 7vw, 4rem), env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    font-family: Geist, system-ui, -apple-system, sans-serif;
    font-size: 12px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .card {
    width: 100%;
    max-width: 27ch;
  }

  /* The logo sits above the message and shares its left edge. The slot owns
     position so the logo inside is free to own rotation. */
  .logo-slot {
    width: 20px;
    height: 20px;
    margin-bottom: 1.5rem;
  }

  .js .logo-slot { will-change: transform; }

  .logo-slot.is-settling { transition: transform 720ms var(--ease-dramatic); }

  .logo {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Rotation matches the 0.75s sweep the nav logo uses on lydiashan.com,
     then holds briefly before going again while the page loads. */
  .logo.is-loading { animation: logo-spin 1.25s var(--ease-dramatic) infinite; }

  .message {
    position: relative;
    margin: 0;
    font-size: 12px;
    line-height: 1.7;
  }

  /* The ghost copy holds the block at its final height so nothing shifts
     while typing. It becomes the visible text when JS is unavailable. */
  .js .ghost { visibility: hidden; }

  .live { display: none; }

  .js .live {
    display: block;
    position: absolute;
    inset: 0;
  }

  .caret {
    display: inline-block;
    width: 1.5px;
    height: 1.05em;
    vertical-align: -0.16em;
    margin-left: 0.09em;
    background: var(--primary);
    animation: blink 1.1s steps(1, end) infinite;
  }

  /* Kept out of sight until typing begins, so the logo has the page to itself
     while it loads. */
  .js .caret { visibility: hidden; }

  .js .message.has-caret .caret { visibility: visible; }

  /* Hold the caret solid while characters land, blink only once idle. */
  .is-typing .caret { animation: none; }

  .socials {
    margin-top: clamp(2rem, 6vh, 3rem);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.15em;
    font-size: 12px;
  }

  .js .socials {
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.7s var(--ease-smooth), transform 0.7s var(--ease-smooth);
  }

  .js .socials.is-revealed {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }

  .socials a {
    color: var(--subdued);
    text-decoration: none;
    padding: 0.45em 0;
    transition: color 0.25s var(--ease-smooth);
  }

  .socials a:hover,
  .socials a:focus-visible { color: var(--primary); }

  .socials a:focus-visible {
    outline: 1.5px solid var(--primary);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .socials .sep {
    color: var(--faint);
    -webkit-user-select: none;
    user-select: none;
  }

  .signature {
    margin: 1.5rem 0 0;
    font-size: 11px;
  }

  .js .signature {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s var(--ease-smooth) 0.2s;
  }

  .js .signature.is-revealed {
    opacity: 1;
    pointer-events: auto;
  }

  .signature a {
    color: var(--light);
    text-decoration: none;
    transition: color 0.25s var(--ease-smooth);
  }

  .signature a:hover,
  .signature a:focus-visible { color: var(--primary); }

  /* Typing sound is off until it can legally start, so the toggle doubles as
     the affordance that turns it on and replays the message. */
  .sound-toggle {
    position: fixed;
    top: max(1.25rem, env(safe-area-inset-top));
    right: max(1.25rem, env(safe-area-inset-right));
    display: none;
    align-items: center;
    gap: 0.5em;
    padding: 0.5em 0.15em;
    border: 0;
    background: none;
    cursor: pointer;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--light);
    transition: color 0.25s var(--ease-smooth);
  }

  .js .sound-toggle { display: flex; }

  .sound-toggle:hover { color: var(--subdued); }

  .sound-toggle:focus-visible {
    outline: 1.5px solid var(--primary);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .sound-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--faint);
    transition: background-color 0.25s var(--ease-smooth);
  }

  .sound-toggle[aria-pressed="true"] .sound-dot { background: var(--primary); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes logo-spin {
    0% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(360deg); }
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
    .logo.is-loading { animation: none; }
    .logo-slot.is-settling { transition: none; }
    .js .socials, .js .signature { transition: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo-slot" id="logo-slot">
      <img class="logo" id="logo" src="logo.svg" width="20" height="20" alt="Lydia Shan" />
    </div>

    <p class="message" aria-hidden="true"><span class="ghost" id="ghost">Hey, Lydia here. If you’re reading this message it means I think highly of you, and would like to get to know you.</span><span class="live"><span id="typed"></span><span class="caret"></span></span></p>

    <p class="sr-only">Hey, Lydia here. If you’re reading this message it means I think highly of you, and would like to get to know you.</p>

    <nav class="socials" id="socials" aria-label="Social links">
      <a href="https://www.instagram.com/lydia_shann/" target="_blank" rel="noopener">Instagram</a>
      <span class="sep" aria-hidden="true">/</span>
      <a href="https://x.com/lydia_shann" target="_blank" rel="noopener">Twitter</a>
      <span class="sep" aria-hidden="true">/</span>
      <a href="https://www.are.na/lydia-shan" target="_blank" rel="noopener">Arena</a>
    </nav>

    <p class="signature" id="signature">
      <a href="https://lydiashan.com" target="_blank" rel="noopener">Lydiashan.com</a>
    </p>
  </main>

  <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false" title="Typing sound">
    <span class="sound-dot" aria-hidden="true"></span>
    <span>sound</span>
  </button>

<script>
(function () {
  // --- Pacing -------------------------------------------------------------
  var LOAD_MS = 900;      // logo spins in the middle of the page
  var MOVE_MS = 720;      // logo glides up to sit above the message
  var SETTLE_MS = 260;    // beat after it lands, before typing starts
  var REVEAL_MS = 520;    // beat after the last character, before the links

  var BASE_MS = 52;       // baseline gap between characters
  var SPREAD_MS = 38;     // per-character wobble
  var WORD_MS = 40;       // extra breath at a word boundary
  var COMMA_MS = 260;     // pause after , ; :
  var PERIOD_MS = 540;    // pause after . ! ?
  var SHIFT_FACTOR = 1.3; // reaching for shift costs a beat
  var HESITATE_ODDS = 0.05;
  var HESITATE_MIN = 170;
  var HESITATE_MAX = 480;
  var WORD_SPEED_MIN = 0.6;   // some words arrive in a burst,
  var WORD_SPEED_MAX = 1.55;  // others drag — this is the main source of variation

  var ghost = document.getElementById("ghost");
  var typed = document.getElementById("typed");
  var message = document.querySelector(".message");
  var socials = document.getElementById("socials");
  var signature = document.getElementById("signature");
  var logoSlot = document.getElementById("logo-slot");
  var logo = document.getElementById("logo");
  var toggle = document.getElementById("sound-toggle");

  var text = ghost.textContent;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var timer = null;
  var index = 0;
  var settled = false;
  var typing = false;
  var loaded = false;
  var wordSpeed = 1;

  // --- Typing sound -------------------------------------------------------
  // Synthesised rather than sampled: a filtered noise burst per keystroke, so
  // there's no audio file to download.
  var ctx = null;
  var noise = [];
  var soundOn = false;

  function buildAudio() {
    if (ctx) return ctx;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    ctx = new Ctx();

    for (var n = 0; n < 8; n++) {
      var length = Math.ceil(ctx.sampleRate * 0.04);
      var buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      var samples = buffer.getChannelData(0);
      for (var i = 0; i < length; i++) {
        samples[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3);
      }
      noise.push(buffer);
    }
    return ctx;
  }

  function audible() {
    return soundOn && ctx && ctx.state === "running";
  }

  function keySound(char) {
    if (!audible()) return;

    var isSpace = char === " ";
    var source = ctx.createBufferSource();
    source.buffer = noise[(Math.random() * noise.length) | 0];

    var band = ctx.createBiquadFilter();
    band.type = "bandpass";
    // The spacebar reads lower and softer than the other keys.
    band.frequency.value = isSpace ? 780 + Math.random() * 160 : 1450 + Math.random() * 950;
    band.Q.value = 0.8;

    var gain = ctx.createGain();
    // These look high for a "subtle" click, but the bandpass sheds most of the
    // noise burst's energy — the peak that actually reaches the output is
    // roughly a quarter of the figure set here.
    var peak = isSpace ? 0.28 : 0.15 + Math.random() * 0.1;
    var now = ctx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(peak, now + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + (isSpace ? 0.055 : 0.032));

    source.connect(band);
    band.connect(gain);
    gain.connect(ctx.destination);
    source.start(now);
    source.stop(now + 0.07);
  }

  function paintToggle() {
    toggle.setAttribute("aria-pressed", audible() ? "true" : "false");
  }

  // --- Typing -------------------------------------------------------------
  function isUpper(char) {
    return char !== char.toLowerCase() && char === char.toUpperCase();
  }

  function delayAfter(char, next) {
    if (char === "." || char === "!" || char === "?") return PERIOD_MS + Math.random() * 220;
    if (char === "," || char === ";" || char === ":") return COMMA_MS + Math.random() * 150;

    if (char === " ") {
      // Re-roll the tempo at each word so the pace keeps drifting.
      wordSpeed = WORD_SPEED_MIN + Math.random() * (WORD_SPEED_MAX - WORD_SPEED_MIN);
      var pause = BASE_MS * wordSpeed + Math.random() * WORD_MS;
      if (Math.random() < HESITATE_ODDS) {
        pause += HESITATE_MIN + Math.random() * (HESITATE_MAX - HESITATE_MIN);
      }
      return pause;
    }

    var delay = BASE_MS * wordSpeed + Math.random() * SPREAD_MS;
    if (next && (isUpper(next) || next === "’")) delay *= SHIFT_FACTOR;
    return delay;
  }

  function reveal() {
    socials.classList.add("is-revealed");
    signature.classList.add("is-revealed");
  }

  function settle() {
    settled = true;
    typing = false;
    clearTimeout(timer);
    message.classList.remove("is-typing");
    reveal();
  }

  function step() {
    if (settled) return;

    if (index >= text.length) {
      message.classList.remove("is-typing");
      timer = setTimeout(settle, REVEAL_MS);
      return;
    }

    var char = text.charAt(index);
    typed.textContent += char;
    index += 1;
    keySound(char);
    timer = setTimeout(step, delayAfter(char, text.charAt(index)));
  }

  function startTyping() {
    settled = false;
    typing = true;
    index = 0;
    wordSpeed = 1;
    typed.textContent = "";
    socials.classList.remove("is-revealed");
    signature.classList.remove("is-revealed");
    message.classList.add("has-caret");
    message.classList.add("is-typing");
    clearTimeout(timer);
    timer = setTimeout(step, 0);
  }

  function skip() {
    if (settled || !typing) return;
    typed.textContent = text;
    settle();
  }

  // --- Logo loading sequence ---------------------------------------------
  // The logo starts in the middle of the page, spins the way it does on
  // lydiashan.com, then travels up to its resting place above the message.
  function centreLogo() {
    // Clear the offset first, otherwise the measurement below includes the
    // offset already applied and the logo would cancel itself back to rest.
    logoSlot.style.transform = "none";
    var box = logoSlot.getBoundingClientRect();
    var dx = window.innerWidth / 2 - (box.left + box.width / 2);
    var dy = window.innerHeight / 2 - (box.top + box.height / 2);
    logoSlot.style.transform = "translate(" + Math.round(dx) + "px, " + Math.round(dy) + "px)";
  }

  function land() {
    logoSlot.classList.add("is-settling");
    logoSlot.style.transform = "translate(0px, 0px)";
    window.removeEventListener("resize", centreLogo);

    setTimeout(function () {
      logo.classList.remove("is-loading");
      logoSlot.style.willChange = "auto";
      loaded = true;
      startTyping();
    }, MOVE_MS + SETTLE_MS);
  }

  // --- Wiring -------------------------------------------------------------
  toggle.addEventListener("click", function (event) {
    event.stopPropagation();

    if (audible()) {
      soundOn = false;
      paintToggle();
      return;
    }

    soundOn = true;
    buildAudio();
    var resumed = ctx && ctx.state === "suspended" ? ctx.resume() : Promise.resolve();

    Promise.resolve(resumed).then(function () {
      paintToggle();
      // Replay from the top so the sound is actually heard, but never
      // interrupt the intro sequence already in flight.
      if (audible() && loaded) startTyping();
    })["catch"](paintToggle);
  });

  document.addEventListener("pointerdown", function (event) {
    var target = event.target;
    if (target && target.closest && target.closest(".sound-toggle, a")) return;
    skip();
  });

  document.addEventListener("keydown", function (event) {
    if (event.target === toggle) return;
    if (event.key === "Escape" || event.key === "Enter" || event.key === " " || event.key === "Tab") skip();
  });

  if (reduceMotion) {
    loaded = true;
    typed.textContent = text;
    message.classList.add("has-caret");
    reveal();
    return;
  }

  centreLogo();
  window.addEventListener("resize", centreLogo);

  // Geist landing late changes the message height, which moves the logo's
  // resting spot and so its offset from centre.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      if (!loaded) centreLogo();
    });
  }

  logo.classList.add("is-loading");
  setTimeout(land, LOAD_MS);
})();
</script>
</body>
</html>
